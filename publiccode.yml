description:
  en:
    localisedName: jeap-mcp-service
    shortDescription: A Spring Boot/jEAP service that exposes an MCP server for agentic development of jEAP applications
    longDescription: >
      jeap-mcp-server is a Spring Boot/jEAP service that exposes an MCP server for agentic development of jEAP
      applications. It provides a fixed set of `@Tool`-annotated Java methods over HTTP MCP (Spring AI,
      Streamable HTTP), letting AI coding agents look up jEAP source, examples, and platform documentation
      directly. This repository is the reusable core (jeap-mcp-service-web); platform-specific deployment
      repos depend on it and build their own deployable images.
    features:
      - HTTP MCP server (Spring AI, Streamable HTTP)
      - Fixed jEAP tool surface for agentic development
