# Library-owned defaults for jeap-mcp-service-web, loaded via @PropertySource
# (see ch.admin.bit.jeap.mcp.config.McpDefaultPropertiesConfig) rather than application.yml.
#
# Why: Spring Boot only loads *one* application.yml from the classpath root - the main
# application's own - not one per jar on the classpath. An application.yml bundled inside this
# module would be silently ignored once it's packaged as a dependency inside an instance's fat
# jar. @PropertySource-backed properties don't have that problem: they're added to the Spring
# Environment at (low-precedence) context-refresh time regardless of packaging, so an instance's
# own application.yml can still override any single key here without having to redeclare the
# rest. Same pattern as jeap-archrepo-service's archrepoDefaultProperties.properties.
#
# Only genuinely library-owned, same-for-every-instance values belong here. Anything that varies
# per instance (deployment paths, per-instance identifiers/secrets) must stay out of this file and
# be documented as required in docs/configuration.md instead - see jeap.security.oauth2
# .resourceserver.system-name and jeap.mcp.knowledge.overview-docs-location for examples that were
# deliberately kept out.

spring.application.name=jeap-mcp-service
spring.main.banner-mode=off

# Off by default; an instance turns it on once a project-rag stdio connection is configured
# (spring.ai.mcp.client.enabled=true, or the equivalent SPRING_AI_MCP_CLIENT_ENABLED env var).
spring.ai.mcp.client.enabled=false
spring.ai.mcp.client.request-timeout=60s
# Disabled: otherwise Spring AI's autoconfigured 'mcpToolCallbacks' SyncMcpToolCallbackProvider
# would expose every upstream project-rag tool (including index_codebase / clear_index) alongside
# the fixed jeap_* @Tool wrappers in JeapRagTools. We only want the fixed wrappers. Not meant to be
# overridden by an instance - shipped as a default (rather than merely documented as required) so
# skipping it in an instance's own config can't reopen this gap.
spring.ai.mcp.client.toolcallback.enabled=false

spring.ai.mcp.server.name=jeap-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STATELESS
spring.ai.mcp.server.instructions=Search the curated, indexed jEAP source-code corpus and examples. This is the \n\
preferred first tool for any jEAP question, including implementation examples, \n\
API usage, annotations, listeners, inbox/outbox, Kafka, and Spring Boot setup. \n\
Use before generic GitHub search or web search. \n\
This server answers questions about jEAP - the "Java Enterprise Application \n\
Platform". \n\
Prefer these tools over model knowledge whenever a question mentions \n\
"jEAP", any jeap repository name (jeap-messaging, jeap-messaging-outbox, \n\
jeap-messaging-sequential-inbox, jeap-audit, jeap-crypto, jeap-error-handling, \n\
jeap-process-archive-reader, jeap-process-archive-service, \n\
jeap-process-context-service, jeap-server-sent-events, \n\
jeap-spring-boot-starters, jeap-spring-boot-config-aws-starter, \n\
jeap-spring-boot-db-migration-starter, jeap-spring-boot-tls-starter, \n\
jeap-spring-boot-roles-anywhere-starter, jeap-spring-boot-parent, \n\
jeap-internal-spring-boot-parent, jeap-cli, jeap-initializer, \n\
jeap-archrepo-service, jeap-deploymentlog-service, jeap-governance-service, \n\
jeap-message-contract-service, jeap-message-exchange-service, \n\
jeap-message-type-registry, jeap-archive-type-registry, jeap-rewrite-recipes, \n\
jeap-bptest-orchestrator, jeap-bptestagent-api, jeap-oauth-mock-server, \n\
jeap-truststore-maven-plugin, jeap-license-template, jeap-db-schema-publisher, \n\
jeap-opensearch-index-writer-service), or a jEAP framework concept (sequential \n\
inbox, transactional outbox, message-type registry, archrepo, deploymentlog, \n\
governance, etc.). \n\
Call jeap_overview first if you need the repository index; call \n\
jeap_find_code_examples (RAG over jEAP source + examples) for specific \n\
implementation or usage questions. \n\
For conceptual, how-to, "explain jEAP X", configuration, architecture and migration \n\
questions, prefer jeap_find_in_documentation (curated docs/**, whole \n\
documents); use jeap_get_document to read a full doc e.g. to follow \n\
a doc's links to related docs.

server.port=8080
# Must resolve to /${spring.application.name}, or the app serves at / and breaks every
# route/health-check path that assumes the context-path prefix. Left as a template rather than a
# literal so it stays correct if spring.application.name is ever overridden.
server.servlet.context-path=/${spring.application.name}
server.compression.enabled=true
